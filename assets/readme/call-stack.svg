<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" role="img" aria-labelledby="title desc">
  <title id="title">함수 호출과 반환에 따른 스택 변화</title>
  <desc id="desc">main에서 A를 호출하고 A에서 B를 호출하면 각 함수에 필요한 정보가 스택 위쪽에 쌓입니다. B가 반환하면 A로, A가 반환하면 main으로 돌아가며 해당 공간을 정리합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="252" rx="12" fill="#ffffff"/>
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="20" y="20" width="180" height="210" rx="10"/>
    <rect x="290" y="20" width="180" height="210" rx="10"/>
    <rect x="560" y="20" width="180" height="210" rx="10"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <g fill="#e2e8f0">
      <rect x="32" y="166" width="156" height="52" rx="4"/>
      <rect x="302" y="166" width="156" height="52" rx="4"/>
      <rect x="572" y="166" width="156" height="52" rx="4"/>
    </g>
    <g fill="#dbeafe">
      <rect x="302" y="114" width="156" height="52" rx="4"/>
      <rect x="572" y="114" width="156" height="52" rx="4"/>
    </g>
    <rect x="572" y="62" width="156" height="52" rx="4" fill="#bfdbfe"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M 208 104 H 281"/>
    <path d="M 478 104 H 551"/>
    <path d="M 552 184 H 479" stroke-dasharray="5 4"/>
    <path d="M 282 184 H 209" stroke-dasharray="5 4"/>
  </g>
  <g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#0f172a">
      <text x="110" y="46">main() 실행</text>
      <text x="380" y="46">A() 실행</text>
      <text x="650" y="46">B() 실행</text>
    </g>
    <g font-size="14" fill="#0f172a">
      <text x="110" y="197">main() 정보</text>
      <text x="380" y="197">main() 정보</text>
      <text x="650" y="197">main() 정보</text>
      <text x="380" y="145">A() 정보</text>
      <text x="650" y="145">A() 정보</text>
      <text x="650" y="93">B() 정보</text>
    </g>
    <g font-size="12" fill="#475569">
      <text x="245" y="85">A() 호출</text>
      <text x="515" y="85">B() 호출</text>
      <text x="245" y="208">A() 반환</text>
      <text x="515" y="208">B() 반환</text>
    </g>
  </g>
</svg>
